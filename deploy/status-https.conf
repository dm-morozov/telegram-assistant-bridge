# Review-only: dedicated host. Do not install together with status-http.conf.
# limit_req_zone is in the nginx http context through the sites-enabled include.
limit_req_zone $binary_remote_addr zone=telegram_bridge_rate:1m rate=2r/s;
limit_conn_zone $server_name zone=telegram_bridge_total:1m;
server {
    listen 80;
    server_name telegram-bridge.mu56.ru;
    if ($host != telegram-bridge.mu56.ru) { return 421; }
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://telegram-bridge.mu56.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name telegram-bridge.mu56.ru;
    ssl_certificate /etc/letsencrypt/live/telegram-bridge.mu56.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telegram-bridge.mu56.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ssl_server_name != telegram-bridge.mu56.ru) { return 421; }
    if ($host != telegram-bridge.mu56.ru) { return 421; }
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    location = /mcp {
        limit_req zone=telegram_bridge_rate burst=10 nodelay;
        limit_conn telegram_bridge_total 16;
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host telegram-bridge.mu56.ru;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
