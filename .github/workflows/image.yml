name: Build and test isolated status image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Build with resolved official base digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-artifact
          docker pull node:24-bookworm-slim
          base=$(docker image inspect --format '{{index .RepoDigests 0}}' node:24-bookworm-slim)
          printf '%s\n' "$base" > image-artifact/base-image.txt
          printf '%s\n' "$GITHUB_SHA" > image-artifact/source-sha.txt
          docker build --build-arg NODE_BASE="$base" --tag telegram-assistant-bridge:status .
          docker image inspect --format '{{.Id}}' telegram-assistant-bridge:status > image-artifact/image-id.txt
      - name: Host direct and loopback Nginx transport checks
        shell: bash
        run: bash scripts/ci-host-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-status-image
          path: image-artifact/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
