name: Build and test protected synthetic image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm ci --prefix pilot-local --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev && npm audit --prefix pilot-local --omit=dev && npm test
      - name: Build separate image from resolved official digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p synthetic-artifact
          printf '%s\n' "$GITHUB_SHA" > synthetic-artifact/source-sha.txt
          docker pull node:24-bookworm-slim
          base=$(docker image inspect --format '{{index .RepoDigests 0}}' node:24-bookworm-slim)
          printf '%s\n' "$base" > synthetic-artifact/node-base.txt
          docker build -f pilot-local/deploy/Dockerfile --build-arg NODE_BASE="$base" -t telegram-assistant-bridge:synthetic .
          docker image inspect --format '{{.Id}}' telegram-assistant-bridge:synthetic > synthetic-artifact/image-id.txt
          docker pull nginx:stable-alpine
          docker image inspect --format '{{index .RepoDigests 0}}' nginx:stable-alpine > synthetic-artifact/nginx-base.txt
      - name: Protected image host IP and Nginx smoke
        run: node pilot-local/deploy/ci-image-smoke.mjs
      - name: Save only tested image and sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          docker save telegram-assistant-bridge:synthetic | gzip > synthetic-artifact/synthetic-image.tar.gz
          sha256sum synthetic-artifact/synthetic-image.tar.gz > synthetic-artifact/archive-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-synthetic-image
          path: synthetic-artifact/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error